# fly.toml app configuration file generated for notifyx

app = "notifyx"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  # Your FastAPI API
  app = "uvicorn main:app --host 0.0.0.0 --port 8080"

  # Your Celery worker (modify path if needed)
  worker = "celery -A app.celery_app worker --loglevel=info --pool=solo"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
